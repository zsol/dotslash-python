name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "1 8 * * *" # 8:01 UTC every day

jobs:
  check-new-release:
    permissions:
      contents: read
    name: Check for new release in upstream repo
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{steps.check.outputs.upstream_tag}}
      new_release: ${{steps.check.outputs.new_release}}
    steps:
      - id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest \
            | jq -er '.tag_name')
          LATEST_TAG=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | jq -er '.tag_name')
          NEW_RELEASE=false
          if [[ "$LATEST_TAG" != "$UPSTREAM_TAG" ]]; then
            NEW_RELEASE=true
          fi
          printf 'upstream_tag=%s\nnew_release=%s\n' "$UPSTREAM_TAG" "$NEW_RELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: check-new-release
    if: ${{ needs.check-new-release.outputs.new_release == 'true' }}
    permissions:
      attestations: write
      id-token: write
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upstream-tag: ${{ needs.check-new-release.outputs.upstream_tag }}
  release:
    needs: [build, check-new-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.check-new-release.outputs.upstream_tag }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --notes "See https://github.com/astral-sh/python-build-standalone/releases/tag/$TAG_NAME"
